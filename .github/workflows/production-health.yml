name: Production health check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check mainpot.app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the production health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 20
          --retry 2 --retry-delay 5
          https://mainpot.app/api/health
