name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests, and browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:service-worker
      - run: git diff --exit-code -- public/sw.js
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  realtime:
    name: Realtime browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Remove this pinned-bundle assertion with the temporary 1.64 nightly pin
      # after a stable Playwright release carries the fixed network library.
      - name: Verify fixed WebKit network library
        run: strings "$HOME/.cache/ms-playwright/webkit-2369/minibrowser-wpe/sys/lib/libsoup-3.0.so.0" | grep -Fx 'libsoup/3.6.6'
      - run: PLAYWRIGHT_ALL_DEVICES=1 npm run test:e2e:realtime -- --workers=2 --reporter=line,github
      - name: Preserve safe multiplayer failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiplayer-failure-diagnostics
          path: |
            test-results/**/bank-diagnostics.json
            test-results/**/network-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

  database-assurance:
    name: Database migrations and RLS assurance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:operations:isolated

  mobile-smoke:
    name: Mobile browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:mobile

  auth-email:
    name: Confirmed-email authentication and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: PLAYWRIGHT_MOBILE=1 npm run test:e2e:auth -- --workers=2
