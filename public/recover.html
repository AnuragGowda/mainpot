<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f8f6" />
    <title>Recover your game · Mainpot</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f8f6; color: #111318; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100% - 2rem, 28rem); padding: 2rem; border: 1px solid #e5e7eb; border-radius: 1rem; background: white; }
      h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.035em; }
      p { margin: .75rem 0 0; color: #5f6368; line-height: 1.6; }
      button { width: 100%; margin-top: 1.5rem; min-height: 2.75rem; border: 0; border-radius: .65rem; background: #111318; padding: 0 1rem; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      button:focus-visible { outline: 2px solid #111318; outline-offset: 3px; }
      #status { font-size: .875rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recover your game</h1>
      <p>Refresh Mainpot’s app files and reopen your saved table. Your login, players, and money records stay saved.</p>
      <button id="recover" type="button">Refresh and resume game</button>
      <p id="status" role="status"></p>
      <noscript><p>Enable JavaScript to refresh the app.</p></noscript>
    </main>
    <script src="/recover.js"></script>
  </body>
</html>
